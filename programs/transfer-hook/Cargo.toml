[package]
name = "transfer-hook"
version = "0.1.0"
description = "Transfer Hook for PoW Token - Handles 0.01% tax distribution (50% burn, 50% miner rewards split across normal + seeker pools)"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "transfer_hook"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
spl-transfer-hook-interface = "0.8"
spl-tlv-account-resolution = "0.8"
pow-protocol = { path = "../pow-protocol", features = ["cpi"] }
